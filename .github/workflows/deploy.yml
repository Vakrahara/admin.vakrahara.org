name: Deploy Admin Panel to Hostinger

on:
  workflow_dispatch:

concurrency:
  group: deploy-vakrahara-admin
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy Admin Panel
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🏗️ Build Static Next.js Admin
        run: npm run build

      - name: 🚀 Deploy to Hostinger FTPS
        env:
          FTP_SERVER: 91.108.107.97
          FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          LOCAL_DIR: ./out
          REMOTE_DIR: /public_html/admin
        run: node scripts/deploy-ftp.js
